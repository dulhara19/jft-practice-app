<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock exam — JFT-Basic Practice</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="exam-toolbar">
    <a class="exit-link" href="index.html" title="Exit exam">← Exit</a>
    <div class="title" id="paper-title">Loading…</div>
    <div class="timer mono" id="timer" aria-live="polite">--:--</div>
    <button class="btn danger" id="submit-btn">
      Submit
      <span class="kbd">S</span>
    </button>
  </div>

  <main>
    <div class="qgrid-wrap">
      <div class="qgrid-meta">
        <div>Question <span class="mono" id="qpos">— / 60</span></div>
        <div class="legend">
          <span><span class="dot answered"></span> answered</span>
          <span><span class="dot flagged"></span> flagged</span>
          <span><span class="dot"></span> unanswered</span>
        </div>
      </div>
      <div class="qgrid" id="qgrid"></div>
    </div>

    <div id="question-area"></div>

    <div class="q-nav">
      <div class="left">
        <button class="btn secondary" id="prev-btn">← Previous <span class="kbd">←</span></button>
      </div>
      <div class="right">
        <button class="btn ghost" id="flag-btn">⚑ Flag <span class="kbd">F</span></button>
        <button class="btn" id="next-btn">Next → <span class="kbd">→</span></button>
      </div>
    </div>
  </main>

  <div id="modal-root"></div>

  <footer class="site-footer">
    <div class="footer-row">
      <div>© 2026 <a href="about.html"><strong>Dulhara Lakshan</strong></a> · All rights reserved · 著作権所有</div>
      <div class="muted">Unauthorized printing or distribution prohibited · <a href="https://dulharalakshan.me" target="_blank" rel="noopener">dulharalakshan.me</a></div>
    </div>
  </footer>

    <button class="help-toggle" id="help-toggle" aria-label="Keyboard shortcuts">?</button>
  <div class="help-panel" id="help-panel" role="dialog">
    <h4>Keyboard shortcuts</h4>
    <div class="row"><span>Select A / B / C / D</span><span class="keys"><span class="kbd-chip">1</span><span class="kbd-chip">2</span><span class="kbd-chip">3</span><span class="kbd-chip">4</span></span></div>
    <div class="row"><span>Previous / next</span><span class="keys"><span class="kbd-chip">←</span><span class="kbd-chip">→</span></span></div>
    <div class="row"><span>Flag for review</span><span class="keys"><span class="kbd-chip">F</span></span></div>
    <div class="row"><span>Submit exam</span><span class="keys"><span class="kbd-chip">S</span></span></div>
    <div class="row"><span>Replay audio</span><span class="keys"><span class="kbd-chip">R</span></span></div>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <script type="module" src="js/exam.js"></script>
</body>
</html>
